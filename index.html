/* VOICE: a no-nonsense training log, quick to use between sets
   IDEA: the gym's calibrated bumper plates — red, blue, yellow, green — as the colour code
   PICTURE: today's calories drawn as a rubber plate whose rim fills up
   COLOUR and TYPE: rubber black band, chalk-white ground; plate colours for macros; Barlow Condensed numbers + Inter
   LAYOUT: sticky black header with tabs, then one working column of cards per tab */
:root{color-scheme:light dark;--bg:light-dark(#f3f3ef,#0f1013);--card:light-dark(#fff,#191b1f);--ink:light-dark(#121316,#f0f0ec);--mut:light-dark(#5e626b,#a0a4ad);--line:light-dark(#e1e1db,#2a2d33);--soft:light-dark(#eeeee8,#23262b);--red:#d7262e;--blue:#1f5bd8;--yel:#e0a200;--grn:#1d9448;--rub:#17191d}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,.big,.num{font-family:"Barlow Condensed",Inter,sans-serif}
header{background:var(--rub);color:#f2f2ee;padding:14px max(4vw,14px) 0;position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;max-width:1100px;margin:0 auto}
h1{font-size:32px;line-height:1.05;margin:0;font-weight:700}
.pill{font-size:13px;color:#c8cad0;border:1px solid #3a3d44;border-radius:99px;padding:3px 10px;white-space:nowrap}
nav{display:flex;gap:2px;overflow-x:auto;max-width:1100px;margin:8px auto 0}
nav a{flex:none;color:#c8cad0;text-decoration:none;padding:11px 14px;font-weight:600;border-bottom:3px solid transparent}
nav a[aria-current=page]{color:#fff;border-color:var(--red)}
main{max-width:1100px;margin:0 auto;padding:18px max(4vw,14px) 64px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
h2{font-size:24px;line-height:1.1;margin:0 0 10px;font-weight:700}
.mut{color:var(--mut)}.sm{font-size:14px;margin:4px 0}
button{font:inherit;font-weight:600;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer;white-space:nowrap}
.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ghost{background:none;border-color:transparent;color:var(--mut)}
input,select,textarea{font:inherit;font-size:16px;min-height:44px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
textarea{min-height:110px;font-size:13px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.dnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.dnav b{font-size:18px;flex:1;text-align:center;white-space:nowrap}
.hero{display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr);gap:22px;align-items:center}
.ring{width:100%;max-width:250px;display:block;margin:auto}
.rt{font:700 46px "Barlow Condensed",sans-serif;fill:#fff}.rs{font:600 14px Inter,sans-serif;fill:#b8bbc2}
.big{font-size:44px;line-height:1;font-weight:700;margin:0}
.mac{display:grid;gap:12px;margin-top:14px}
.mac .lbl{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:15px}.mac .lbl span{white-space:nowrap}
.bar{height:12px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;border-radius:99px}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.grow{flex:1}.r{text-align:right;white-space:nowrap}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px}
.f5{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}.f5 .w{grid-column:1/-1}
details summary{cursor:pointer;font-weight:600;padding:10px 0;min-height:44px}
.ex{border-top:1px solid var(--line);padding:14px 0}.ex:first-of-type{border-top:0}
.exh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.exh b{font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--soft);border-radius:8px;padding:2px 2px 2px 10px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip button{min-height:34px;padding:0 9px;background:none;border:0;color:var(--mut)}
.setin{display:grid;grid-template-columns:88px auto 80px minmax(0,1fr);gap:8px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--soft);border-radius:12px;padding:10px 12px}.stat .num{font-size:30px;font-weight:700;line-height:1.1}
.fig{position:relative;min-height:170px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.tag{font-size:13px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);white-space:nowrap}
.ok{color:var(--grn)}.bad{color:var(--red)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
label.f{display:grid;gap:4px;font-size:14px;font-weight:600;color:var(--mut)}
@media(max-width:600px){.hero{grid-template-columns:1fr}.big{font-size:36px}h1{font-size:26px}.setin{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}.setin button{grid-column:1/-1}.f5{grid-template-columns:repeat(2,minmax(0,1fr))}}

  return `<section class="card"><h2>Add or edit a food</h2><form id="ff"><input type="hidden" name="id"><div class="f5"><input class="w" name="n" placeholder="Name" required><input class="w" name="u" placeholder="Serving, e.g. 1 bar or 100 g"><input name="k" type="number" step="any" placeholder="kcal" required><input name="p" type="number" step="any" placeholder="Protein g"><input name="c" type="number" step="any" placeholder="Carbs g"><input name="f" type="number" step="any" placeholder="Fat g"></div><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="pri">Save food</button><button type="reset" class="ghost">Clear</button></div></form></section>
  <section class="card"><h2>My foods · ${state.foods.length}</h2>${[...state.foods].sort((a,b)=>a.n.localeCompare(b.n)).map(x=>`<div class="row"><div class="grow"><b>${esc(x.n)}</b><div class="mut sm">${esc(x.u)} · ${fmt(x.k)} kcal · ${r1(x.p)} P · ${r1(x.c)} C · ${r1(x.f)} F${x.k?` · ${r1(x.p/x.k*100)} P/100 kcal`:""}</div></div><button data-a="editf" data-id="${x.id}">Edit</button><button class="ghost" data-a="delf" data-id="${x.id}" aria-label="Delete ${esc(x.n)}">✕</button></div>`).join("")}</section>`;
}
function vTargets(){
  const S=state.settings,mif=10*S.weight+6.25*S.height-5*S.age+5,kat=370+21.6*S.lbm,bmr=(mif+kat)/2,td=bmr*S.act,mid=(S.kMin+S.kMax)/2,def=td-mid;
  const inp=(k,lab,st)=>`<label class="f">${lab}<input type="number" step="${st||1}" data-s="${k}" value="${S[k]}"></label>`;
  return `<div class="grid"><section class="card"><h2>Daily targets</h2><div class="two">${inp("kMin","Calories from")}${inp("kMax","Calories to")}${inp("protein","Protein floor (g)")}</div><p class="mut sm">Protein at 2 g per kg: ${fmt(S.weight*2)} g for ${S.weight} kg.</p></section>
  <section class="card"><h2>Energy estimate</h2><div class="two">${inp("weight","Weight kg",0.1)}${inp("height","Height cm")}${inp("age","Age")}${inp("lbm","Lean mass kg (InBody)",0.1)}</div>
  <label class="f" style="margin-top:8px">Activity<select data-s="act">${[[1.2,"Mostly sitting"],[1.375,"Light: 1–3 workouts a week"],[1.55,"Moderate: 4–5 workouts a week"],[1.725,"Very active"]].map(o=>`<option value="${o[0]}" ${+S.act===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></label>
  <div class="stats" style="margin-top:12px"><div class="stat"><div class="mut sm">BMR</div><div class="num">${fmt(bmr)}</div><div class="mut sm">Mifflin ${fmt(mif)} · Katch ${fmt(kat)}</div></div><div class="stat"><div class="mut sm">TDEE</div><div class="num">${fmt(td)}</div><div class="mut sm">kcal a day</div></div><div class="stat"><div class="mut sm">Deficit at ${fmt(mid)}</div><div class="num">${fmt(def)}</div><div class="mut sm">≈ ${r1(def*7/7700)} kg a week</div></div></div></section></div>
  <section class="card"><h2>Backup</h2><p class="mut sm">Copy your data to keep a backup, or paste a backup to restore it.</p><textarea id="exp" readonly aria-label="Exported data">${esc(JSON.stringify(state))}</textarea><div style="display:flex;gap:8px;margin:8px 0 16px;flex-wrap:wrap"><button data-a="copy">Copy data</button>${window.claude?"":`<button data-a="dl">Download backup file</button>`}</div><label class="f" style="margin-bottom:8px">Restore from a backup file<input type="file" id="impf" accept=".json,application/json"></label><textarea id="imp" placeholder="Paste a backup here" aria-label="Backup to import"></textarea><div style="margin-top:8px"><button data-a="import">Restore from backup</button> <span id="impmsg" class="mut sm"></span></div></section>`;
}
let FC={};const DAY=864e5;
function tdeeOf(S){const mif=10*S.weight+6.25*S.height-5*S.age+5,kat=370+21.6*S.lbm;return(mif+kat)/2*S.act}
function avgIntake(){const td=ymd(new Date());let ds=Object.keys(state.logs).filter(d=>d<td&&state.logs[d].length).sort().slice(-7);if(!ds.length)ds=Object.keys(state.logs).filter(d=>state.logs[d].length).sort().slice(-7);const S=state.settings;if(!ds.length)return{k:(S.kMin+S.kMax)/2,n:0};return{k:ds.reduce((a,d)=>a+tot(state.logs[d]).k,0)/ds.length,n:ds.length}}
function forecast(){
  const B=[...state.body].sort((a,b)=>a.d.localeCompare(b.d)),L=B[B.length-1];if(!L||!L.w)return null;
  const S=state.settings,g=S.gBf||17,td=tdeeOf(S),ai=avgIntake(),def=td-ai.k,wk=def*7/7700;
  const cut=ymd(new Date(Date.now()-14*DAY)),tr=state.workouts.filter(w=>w.d>=cut&&w.ex.some(e=>e.sets.length)).length,training=tr>=2;
  const fs=wk>0?(training?0.85:0.7):(training?0.5:0.3),mg=training?0.07:-0.05;
  const pb=L.pbf!=null?L.pbf:(L.bfm!=null?L.bfm/L.w*100:22),bf0=L.bfm!=null?L.bfm:L.w*pb/100,sm0=L.smm,t0=pd(L.d).getTime();
  const pts=[];let eta=null;
  for(let i=0;i<=104;i++){const w=L.w-wk*i,bf=Math.max(bf0-wk*fs*i,0.05*w),p=bf/w*100,sm=sm0!=null?sm0+mg*Math.min(i,26):null;const o={t:t0+i*7*DAY,i,w,p,sm};if(i<=16)pts.push(o);if(eta==null&&p<=g)eta=o;if(eta&&i>16)break}
  const past=B.filter(e=>pd(e.d).getTime()>=t0-150*DAY);
  FC.fw={col:"var(--ink)",unit:"kg",past:past.map(e=>[pd(e.d).getTime(),e.w]),fut:pts.map(o=>[o.t,r1(o.w)])};
  FC.fp={col:"var(--yel)",unit:"%",goal:g,past:past.filter(e=>e.pbf!=null).map(e=>[pd(e.d).getTime(),e.pbf]),fut:pts.map(o=>[o.t,r1(o.p)])};
  if(sm0!=null)FC.fs={col:"var(--red)",unit:"kg",past:past.filter(e=>e.smm!=null).map(e=>[pd(e.d).getTime(),e.smm]),fut:pts.map(o=>[o.t,r1(o.sm)])};
  return{L,td,ai,def,wk,training,tr,fs,pts,eta,g};
}
function vForecast(){
  const F=forecast();if(!F)return"";const S=state.settings,dt=t=>new Date(t).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
  const head=F.wk<=0?`At this intake you're not in a deficit`:F.eta?`${F.g}% body fat around ${dt(F.eta.t)}`:`${F.g}% is more than 2 years away at this pace`;
  const wkStat=n=>{const o=F.pts[n];return o?`<div class="stat"><div class="mut sm">Week ${n} · ${new Date(o.t).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</div><div class="num">${r1(o.w)}<span style="font-size:16px"> kg</span></div><div class="mut sm">${r1(o.p)}% fat${o.sm!=null?" · "+r1(o.sm)+" kg muscle":""}</div></div>`:""};
  return `<section class="card"><h2>Forecast</h2><p class="big" style="font-size:34px">${head}</p>
  <p class="mut sm">Based on ${fmt(F.ai.k)} kcal a day (${F.ai.n?`your average over the last ${F.ai.n} logged day${F.ai.n>1?"s":""}`:"your target"}) against a daily burn of about ${fmt(F.td)} kcal: ${F.wk>=0?"−":"+"}${Math.abs(r1(F.wk))} kg a week. ${F.training?`You trained ${F.tr} times in the last 2 weeks, so most of the loss should be fat and muscle can creep up.`:`You've trained fewer than 2 times in the last 2 weeks, so more of the loss may be muscle. Training 2+ times a week improves this forecast.`}</p>
  <div class="stats" style="margin:12px 0">${wkStat(4)}${wkStat(8)}${wkStat(12)}${F.eta?`<div class="stat"><div class="mut sm">At ${F.g}% fat</div><div class="num">${r1(F.eta.w)}<span style="font-size:16px"> kg</span></div><div class="mut sm">week ${F.eta.i}</div></div>`:""}</div>
  <div class="grid">${[["fw","Weight forecast (kg)"],["fp","Body fat % forecast"],["fs","Muscle forecast (kg)"]].filter(c=>FC[c[0]]).map(c=>`<div><b>${c[1]}</b><div class="fig"><svg data-fc="${c[0]}" role="img" aria-label="${c[1]}"></svg></div></div>`).join("")}</div>
  <div class="two" style="margin-top:10px"><label class="f">Goal body fat %<input type="number" step="0.5" data-s="gBf" value="${S.gBf||17}"></label></div>
  <p class="mut sm">Solid line is your real data, dashed is the projection. It's simple energy maths (7,700 kcal ≈ 1 kg), not a promise: water makes real weigh-ins wobble, so compare against new entries every couple of weeks.</p></section>`;
}
function vStrength(){
  const cnt={};for(const w of state.workouts)for(const e of w.ex)if(e.sets.some(s=>s[0]>0))cnt[e.n]=(cnt[e.n]||0)+1;
  const names=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||a.localeCompare(b));if(!names.length)return"";
  const n=names.includes(ui.lift)?ui.lift:names[0];
  const past=state.workouts.map(w=>{const e=w.ex.find(x=>norm(x.n)===norm(n));if(!e)return null;const m=Math.max(0,...e.sets.filter(s=>s[0]>0).map(s=>s[0]*(1+s[1]/30)));return m?[pd(w.d).getTime(),r1(m)]:null}).filter(Boolean).sort((a,b)=>a[0]-b[0]);
  const last=past[past.length-1],fut=[];for(let i=0;i<=12;i++)fut.push([last[0]+i*7*DAY,r1(last[1]*(1+0.01*i))]);
  FC.lift={col:"var(--blue)",unit:"kg",past,fut};
  return `<section class="card"><h2>Strength trend</h2><label class="f">Exercise<select id="lift">${names.map(x=>`<option ${x===n?"selected":""}>${esc(x)}</option>`).join("")}</select></label>
  <div class="stats" style="margin:12px 0"><div class="stat"><div class="mut sm">Estimated 1-rep max now</div><div class="num">${last[1]}<span style="font-size:16px"> kg</span></div></div><div class="stat"><div class="mut sm">In 12 weeks</div><div class="num">${fut[12][1]}<span style="font-size:16px"> kg</span></div><div class="mut sm">at about 1% a week</div></div></div>
  <div class="fig"><svg data-fc="lift" role="img" aria-label="Strength trend for ${esc(n)}"></svg></div>
  <p class="mut sm">Estimated from your best set each session (weight × (1 + reps ÷ 30)). About 1% a week is typical when you train consistently and add weight or reps.</p></section>`;
}
function drawFc(svg){
  const c=FC[svg.dataset.fc];if(!c)return;const W=svg.clientWidth,H=svg.clientHeight;if(!W||!H)return;
  const all=[...c.past,...c.fut];const ts=all.map(p=>p[0]),vs=all.map(p=>p[1]).concat(c.goal!=null?[c.goal]:[]);
  let t0=Math.min(...ts),t1=Math.max(...ts);if(t1===t0)t1=t0+DAY;let mn=Math.min(...vs),mx=Math.max(...vs);if(mx-mn<1){mn-=0.5;mx+=0.5}const pd2=(mx-mn)*0.12;mn-=pd2;mx+=pd2;
  const l=8,r=50,t=16,b=26,X=v=>l+(v-t0)/(t1-t0)*(W-l-r),Y=v=>t+(mx-v)/(mx-mn)*(H-t-b);
  const path=P=>P.map((p,i)=>`${i?"L":"M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
  const f=c.fut,lp=c.past[c.past.length-1],fe=f[f.length-1];
  let s=[mn+pd2,mx-pd2].map(v=>`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${W-r+6}" y="${Y(v)+4}" font-size="12" fill="var(--mut)">${r1(v)}</text>`).join("");
  if(c.goal!=null)s+=`<line x1="${l}" x2="${W-r}" y1="${Y(c.goal)}" y2="${Y(c.goal)}" stroke="var(--grn)" stroke-dasharray="2 4"/><text x="${l+2}" y="${Y(c.goal)-5}" font-size="12" fill="var(--grn)">goal ${c.goal}${c.unit}</text>`;
  if(c.past.length)s+=`<path d="${path(c.past)}" fill="none" stroke="${c.col}" stroke-width="2.5"/>`+c.past.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3" fill="${c.col}"/>`).join("");
  s+=`<path d="${path(f)}" fill="none" stroke="${c.col}" stroke-width="2.5" stroke-dasharray="6 5" opacity=".75"/><circle cx="${X(fe[0])}" cy="${Y(fe[1])}" r="4.5" fill="var(--card)" stroke="${c.col}" stroke-width="2"/>`;
  s+=`<text x="${X(fe[0])-8}" y="${Math.max(Y(fe[1])-10,14)}" text-anchor="end" font-size="13" font-weight="700" fill="var(--ink)">${fe[1]}</text>`;
  if(lp)s+=`<text x="${Math.max(X(lp[0]),l+30)}" y="${Math.max(Y(lp[1])-10,14)}" text-anchor="middle" font-size="12" fill="var(--mut)">now ${lp[1]}</text>`;
  const md=t=>new Date(t).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  s+=`<text x="${l}" y="${H-6}" font-size="12" fill="var(--mut)">${md(t0)}</text><text x="${W-r}" y="${H-6}" font-size="12" fill="var(--mut)" text-anchor="end">${md(t1)}</text>`;
  svg.innerHTML=s;
}
function drawChart(svg){
  const k=svg.dataset.k,col=svg.dataset.c,pts=[...state.body].filter(e=>e[k]!=null).sort((a,b)=>a.d.localeCompare(b.d));
  const W=svg.clientWidth,H=svg.clientHeight;if(!W||!H)return;if(pts.length<1){svg.innerHTML="";return}
  const l=8,r=58,t=16,b=26,vs=pts.map(p=>p[k]);let mn=Math.min(...vs),mx=Math.max(...vs);if(mx-mn<1){mn-=0.5;mx+=0.5}const pad=(mx-mn)*0.15;mn-=pad;mx+=pad;
  const X=i=>l+(pts.length===1?(W-l-r)/2:i*(W-l-r)/(pts.length-1)),Y=v=>t+(mx-v)/(mx-mn)*(H-t-b);
  const line=pts.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(p[k]).toFixed(1)}`).join("");
  const last=pts[pts.length-1],gl=[mn+pad,mx-pad].map(v=>`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${W-r+6}" y="${Y(v)+4}" font-size="12" fill="var(--mut)">${r1(v)}</text>`).join("");
  svg.innerHTML=`${gl}<path d="${line}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p[k])}" r="${i===pts.length-1?5:3}" fill="${col}"/>`).join("")}<text x="${l}" y="${H-6}" font-size="12" fill="var(--mut)">${W<420?pd(pts[0].d).getFullYear():short(pts[0].d)+" "+pd(pts[0].d).getFullYear()}</text><text x="${W-r}" y="${H-6}" font-size="12" fill="var(--mut)" text-anchor="end">${short(last.d)}</text><text x="${X(pts.length-1)-8}" y="${Math.max(Y(last[k])-10,14)}" text-anchor="end" font-size="13" font-weight="700" fill="var(--ink)">${last[k]}</text>`;
}
function render(){
  for(const o of obs)o.disconnect();obs=[];FC={};
  const V={today:vToday,gym:vGym,body:vBody,foods:vFoods,targets:vTargets}[ui.tab]||vToday;
  document.getElementById("app").innerHTML=`<header><div class="top"><h1>Karim's Tracker</h1><span class="pill" id="status">${status}</span></div><nav aria-label="Sections">${Object.entries(TABS).map(([k,v])=>`<a href="#${k}" ${k===ui.tab?'aria-current="page"':""}>${v}</a>`).join("")}</nav></header><main>${V()}</main>`;
  for(const s of document.querySelectorAll("svg[data-k]")){const ro=new ResizeObserver(()=>drawChart(s));ro.observe(s);obs.push(ro)}
  for(const s of document.querySelectorAll("svg[data-fc]")){const ro=new ResizeObserver(()=>drawFc(s));ro.observe(s);obs.push(ro)}
  saveUI();
}
const shift=n=>{const d=pd(ui.date);d.setDate(d.getDate()+n);ui.date=ymd(d);render()};
function addEntry(x,q){(state.logs[ui.date]=state.logs[ui.date]||[]).push({id:uid(),n:x.n,k:+x.k||0,p:+x.p||0,c:+x.c||0,f:+x.f||0,q:q||1});commit()}
function ensureW(){let W=curW();if(!W){W={d:ui.date,s:sessKey(),ex:[]};state.workouts.push(W)}return W}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
  if(a==="prev")shift(-1);else if(a==="next")shift(1);else if(a==="tod"){ui.date=ymd(new Date());render()}
  else if(a==="add"){const x=state.foods.find(f=>f.id===b.dataset.id);if(x)addEntry(x,ui.qty)}
  else if(a==="del"){state.logs[ui.date].splice(+b.dataset.i,1);commit()}
  else if(a==="set"){const i=b.dataset.i,w=parseFloat(document.getElementById("w"+i).value)||0,r=parseInt(document.getElementById("r"+i).value,10);if(!r){document.getElementById("r"+i).focus();return}const W=ensureW();let ex=W.ex.find(x=>norm(x.n)===norm(b.dataset.n));if(!ex){ex={n:b.dataset.n,sets:[]};W.ex.push(ex)}ex.sets.push([w,r]);commit()}
  else if(a==="rmset"){const W=curW(),ex=W&&W.ex.find(x=>norm(x.n)===norm(b.dataset.n));if(ex){ex.sets.splice(+b.dataset.j,1);commit()}}
  else if(a==="addex"){const n=document.getElementById("newex").value.trim();if(!n)return;const W=ensureW();if(!W.ex.some(x=>norm(x.n)===norm(n)))W.ex.push({n,sets:[]});commit()}
  else if(a==="delb"){state.body=state.body.filter(x=>x.d!==b.dataset.d);commit()}
  else if(a==="delf"){state.foods=state.foods.filter(x=>x.id!==b.dataset.id);commit()}
  else if(a==="editf"){const x=state.foods.find(f=>f.id===b.dataset.id),f=document.getElementById("ff");if(x&&f){for(const k of["id","n","u","k","p","c","f"])f.elements[k].value=x[k]??"";f.scrollIntoView({behavior:"smooth"});f.elements.n.focus()}}
  else if(a==="copy"){const t=document.getElementById("exp");try{navigator.clipboard.writeText(t.value).then(()=>{b.textContent="Copied"},()=>{t.select();b.textContent="Selected, press copy"})}catch(err){t.select()}}
  else if(a==="dl"){try{const u=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:"application/json"})),x=document.createElement("a");x.href=u;x.download="tracker-backup-"+ymd(new Date())+".json";document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(err){b.textContent="Use Copy data instead"}}
  else if(a==="import"){const m=document.getElementById("impmsg");try{const s=JSON.parse(document.getElementById("imp").value);if(!s.foods||!s.logs)throw 0;state=s;commit()}catch(err){m.textContent="That doesn't look like a backup from this app."}}
});
document.addEventListener("input",e=>{const t=e.target;if(t.id==="q"){ui.q=t.value;document.getElementById("res").innerHTML=results();saveUI()}else if(t.id==="qty"){ui.qty=parseFloat(t.value)||1;saveUI()}});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.s){const v=parseFloat(t.value);if(!isNaN(v)){state.settings[t.dataset.s]=v;commit()}}
  else if(t.id==="lift"){ui.lift=t.value;render()}
  else if(t.id==="impf"&&t.files[0]){t.files[0].text().then(txt=>{try{const s=JSON.parse(txt);if(!s.foods||!s.logs)throw 0;state=s;commit()}catch(err){const m=document.getElementById("impmsg");if(m)m.textContent="That file isn't a backup from this app."}})}
  else if(t.id==="sess"){ui.sess[ui.date]=t.value;const W=curW();if(W){W.s=t.value;commit()}else render()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id&&/^r\d+$/.test(e.target.id)){e.preventDefault();const b=document.querySelector(`[data-a="set"][data-i="${e.target.id.slice(1)}"]`);if(b)b.click()}});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target,v=n=>f.elements[n]?f.elements[n].value.trim():"";
  if(f.id==="cf"){const x={n:v("n"),u:v("u")||"1 serving",k:+v("k")||0,p:+v("p")||0,c:+v("c")||0,f:+v("f")||0};if(f.elements.save.checked)state.foods.push({id:uid(),...x});addEntry(x,ui.qty)}
  else if(f.id==="ff"){const x={n:v("n"),u:v("u")||"1 serving",k:+v("k")||0,p:+v("p")||0,c:+v("c")||0,f:+v("f")||0},id=v("id");const o=id&&state.foods.find(q=>q.id===id);if(o)Object.assign(o,x);else state.foods.push({id:uid(),...x});commit()}
  else if(f.id==="bf"){const n=k=>v(k)===""?undefined:+v(k);const x={d:v("d"),w:n("w"),smm:n("smm"),bfm:n("bfm"),pbf:n("pbf")};for(const k in x)if(x[k]===undefined)delete x[k];state.body=state.body.filter(q=>q.d!==x.d).concat([x]);commit()}
});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(TABS[h]&&h!==ui.tab){ui.tab=h;render();window.scrollTo(0,0)}});
render();
}
</script></body></html>
