/* VOICE: a no-nonsense training log, quick to use between sets
   IDEA: the gym's calibrated bumper plates — red, blue, yellow, green — as the colour code
   PICTURE: today's calories drawn as a rubber plate whose rim fills up
   COLOUR and TYPE: rubber black band, chalk-white ground; plate colours for macros; Barlow Condensed numbers + Inter
   LAYOUT: sticky black header with tabs, then one working column of cards per tab */
:root{color-scheme:light dark;--bg:light-dark(#f3f3ef,#0f1013);--card:light-dark(#fff,#191b1f);--ink:light-dark(#121316,#f0f0ec);--mut:light-dark(#5e626b,#a0a4ad);--line:light-dark(#e1e1db,#2a2d33);--soft:light-dark(#eeeee8,#23262b);--red:#d7262e;--blue:#1f5bd8;--yel:#e0a200;--grn:#1d9448;--rub:#17191d}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,.big,.num{font-family:"Barlow Condensed",Inter,sans-serif}
header{background:var(--rub);color:#f2f2ee;padding:calc(12px + env(safe-area-inset-top)) max(4vw,16px) 12px;position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;max-width:1100px;margin:0 auto}
h1{font-size:32px;line-height:1.05;margin:0;font-weight:700}
.pill{font-size:13px;color:#c8cad0;border:1px solid #3a3d44;border-radius:99px;padding:3px 10px;white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--rub);border-top:1px solid #2a2d33;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#9da1a9;text-decoration:none;font-size:12px;font-weight:600;padding:7px 0 5px;border-radius:10px}
nav a svg{width:24px;height:24px}
nav a[aria-current=page]{color:#fff}nav a[aria-current=page] svg{color:var(--red)}
.seg{display:flex;gap:6px;overflow-x:auto;margin:0 -2px;padding:2px;scrollbar-width:none}.seg button{flex:1 0 auto;border-radius:99px;min-height:40px;padding:0 11px;font-size:14px}.goal .num{font-size:24px}.seg .on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
details.card>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0;min-height:36px}details.card>summary::-webkit-details-marker{display:none}details.card>summary h2{margin:0}details.card>summary::after{content:"+";font:600 26px Inter,sans-serif;color:var(--mut);line-height:1}details.card[open]>summary::after{content:"–"}details.card[open]>summary{margin-bottom:12px}
main{max-width:1100px;margin:0 auto;padding:16px max(4vw,14px) calc(100px + env(safe-area-inset-bottom));display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
h2{font-size:24px;line-height:1.1;margin:0 0 10px;font-weight:700}
.mut{color:var(--mut)}.sm{font-size:14px;margin:4px 0}
button{font:inherit;font-weight:600;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer;white-space:nowrap}
.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ghost{background:none;border-color:transparent;color:var(--mut)}
input,select,textarea{font:inherit;font-size:16px;min-height:44px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
textarea{min-height:110px;font-size:13px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.dnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.dnav b{font-size:18px;flex:1;text-align:center;white-space:nowrap}
.hero{display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr);gap:22px;align-items:center}
.ring{width:100%;max-width:250px;display:block;margin:auto}
.rt{font:700 46px "Barlow Condensed",sans-serif;fill:#fff}.rs{font:600 14px Inter,sans-serif;fill:#b8bbc2}
.big{font-size:44px;line-height:1;font-weight:700;margin:0}
.mac{display:grid;gap:12px;margin-top:14px}
.mac .lbl{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:15px;margin-top:2px}.mac .lbl span{white-space:nowrap}
.bar{height:12px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;border-radius:99px}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.grow{flex:1}.r{text-align:right;white-space:nowrap}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px}
.f5{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}.f5 .w{grid-column:1/-1}
details summary{cursor:pointer;font-weight:600;padding:10px 0;min-height:44px}
.ex{border-top:1px solid var(--line);padding:14px 0}.ex:first-of-type{border-top:0}
.exh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.exh b{font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--soft);border-radius:8px;padding:2px 2px 2px 10px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip button{min-height:34px;padding:0 9px;background:none;border:0;color:var(--mut)}
.setin{display:grid;grid-template-columns:88px auto 80px minmax(0,1fr);gap:8px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--soft);border-radius:12px;padding:10px 12px}.stat .num{font-size:30px;font-weight:700;line-height:1.1}
.fig{position:relative;min-height:170px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.tag{font-size:13px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);white-space:nowrap}
.ok{color:var(--grn)}.bad{color:var(--red)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
label.f{display:grid;gap:4px;font-size:14px;font-weight:600;color:var(--mut)}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;border-top:1px solid var(--line);font-weight:600;cursor:pointer}.tog input{width:24px;height:24px;min-height:24px;accent-color:var(--red)}

@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes gy{from{transform:scaleY(0)}}
@keyframes gx{from{transform:scaleX(0)}}
@keyframes ringin{from{stroke-dasharray:0 999}}
@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes flash{0%{background:color-mix(in srgb,var(--grn) 30%,transparent)}100%{background:transparent}}
@keyframes conf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),calc(var(--y) + 260px)) rotate(var(--r));opacity:0}}
main.enter>*{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
main.enter>*:nth-child(2){animation-delay:.06s}main.enter>*:nth-child(3){animation-delay:.12s}main.enter>*:nth-child(4){animation-delay:.18s}main.enter>*:nth-child(5){animation-delay:.24s}main.enter>*:nth-child(n+6){animation-delay:.3s}
main.enter .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s .2s cubic-bezier(.4,0,.2,1) forwards}
main.enter .fu,main.enter .pt{animation:fade .5s 1s both}
main.enter .gb{transform-box:fill-box;transform-origin:bottom;animation:gy .7s cubic-bezier(.2,.8,.2,1) both}
main.enter .bar i{transform-origin:left;animation:gx .9s .15s cubic-bezier(.2,.8,.2,1) both}
main.enter .arc{animation:ringin 1.1s .15s cubic-bezier(.2,.8,.2,1) both}
.bar i{transition:width .5s cubic-bezier(.2,.8,.2,1)}
.chip.new,.newr{animation:pop .4s cubic-bezier(.2,.8,.2,1)}.newr{animation:flash 1.2s ease-out}
.chip.up{background:color-mix(in srgb,var(--grn) 22%,var(--soft))}.chip.dn{background:color-mix(in srgb,var(--red) 18%,var(--soft))}
.chip.ghostc{background:none;border:1.5px dashed var(--line);color:var(--mut);padding:6px 10px}
.coach{display:grid;gap:3px;border-left:4px solid var(--mut);background:var(--soft);border-radius:10px;padding:9px 12px;margin:8px 0;font-size:14px}
.coach b{font-size:16px}.coach.up{border-color:var(--grn)}.coach.up b{color:var(--grn)}.coach.reps{border-color:var(--blue)}.coach.hold{border-color:var(--yel)}.coach.down{border-color:var(--red)}.coach.down b{color:var(--red)}
.exdone .exh b{color:var(--grn)}
.gprog{display:grid;gap:6px;margin:12px 0 4px}
.tag.up{background:color-mix(in srgb,var(--grn) 22%,var(--soft))}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translate(-50%,-24px);opacity:0;pointer-events:none;z-index:20;display:flex;align-items:center;gap:10px;max-width:min(92vw,520px);background:var(--ink);color:var(--card);padding:10px 12px 10px 16px;border-radius:14px;font-weight:600;font-size:15px;box-shadow:0 10px 30px rgb(0 0 0/.35);transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .3s}

  else if(a==="addsess"){const k="s"+uid();state.plan[k]={name:"New session",ex:[]};commit()}
  else if(a==="delsess"){const k=b.dataset.k;delete state.plan[k];for(const d in state.wk)if(state.wk[d]===k)state.wk[d]="rest";commit()}
  else if(a==="delb"){state.body=state.body.filter(x=>x.d!==b.dataset.d);commit()}
  else if(a==="delf"){state.foods=state.foods.filter(x=>x.id!==b.dataset.id);commit()}
  else if(a==="editf"){const x=state.foods.find(f=>f.id===b.dataset.id),f=document.getElementById("ff");if(x&&f){const dd=f.closest("details");if(dd)dd.open=true;for(const k of["id","n","u","k","p","c","f"])f.elements[k].value=x[k]??"";f.scrollIntoView({behavior:"smooth"});f.elements.n.focus()}}
  else if(a==="copy"){const t=document.getElementById("exp");try{navigator.clipboard.writeText(t.value).then(()=>{b.textContent="Copied"},()=>{t.select();b.textContent="Selected, press copy"})}catch(err){t.select()}}
  else if(a==="dl"){try{const u=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:"application/json"})),x=document.createElement("a");x.href=u;x.download="tracker-backup-"+ymd(new Date())+".json";document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(err){b.textContent="Use Copy data instead"}}
  else if(a==="import"){const m=document.getElementById("impmsg");try{const s=JSON.parse(document.getElementById("imp").value);if(!s.foods||!s.logs)throw 0;state=s;defaults();ui.msg="Restored ✓ "+Object.keys(s.logs).length+" days of food, "+(s.body||[]).length+" body entries";commit()}catch(err){m.textContent="That doesn't look like a backup from this app."}}
});
document.addEventListener("pointerdown",e=>{window.lastPX=e.clientX;const sv=e.target.closest&&e.target.closest("svg[data-fc],svg[data-k],svg[data-g]");if(!sv){clearTips();return}if(sv){const r=sv.getBoundingClientRect();tipAt(sv,e.clientX-r.left)}});
document.addEventListener("pointermove",e=>{if(!e.buttons)return;const sv=e.target.closest&&e.target.closest("svg[data-fc],svg[data-k],svg[data-g]");if(sv){const r=sv.getBoundingClientRect();tipAt(sv,e.clientX-r.left)}});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset&&t.dataset.mb!=null){mbRows()[+t.dataset.mb][t.dataset.k]=t.value;const el=document.getElementById("mbtot");if(el)el.innerHTML=mbTotals();const nm=document.getElementById("mbn");if(nm)nm.placeholder=mbName();saveUI();return}if(t.id==="aoq"){ui.ao.q=t.value;ui.ao.sel=null;aoRefresh();return}if(t.id==="aoamt"){ui.ao.amt=t.value;const t2=aoTot(),m=document.querySelector("#aob .mbt");if(t2&&m)m.innerHTML=`<div><b class="num">${fmt(t2.k)}</b><span class="mut sm">kcal</span></div><div><b class="num">${r1(t2.p)}</b><span class="mut sm">protein</span></div><div><b class="num">${r1(t2.c)}</b><span class="mut sm">carbs</span></div><div><b class="num">${r1(t2.f)}</b><span class="mut sm">fat</span></div>`;return}if(t.id==="fq"){ui.fq=t.value;saveUI();clearTimeout(window.fqT);window.fqT=setTimeout(()=>{render();const el=document.getElementById("fq");if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}},250);return}if(t.id==="mbn"){ui.mb.name=t.value;saveUI();return}if(t.id==="q"){ui.q=t.value;document.getElementById("res").innerHTML=results();saveUI()}else if(t.id==="qty"){ui.qty=parseFloat(t.value)||1;saveUI()}});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.s){const v=parseFloat(t.value);state.settings[t.dataset.s]=isNaN(v)?0:v;commit()}
  else if(t.dataset.ss){state.settings[t.dataset.ss]=t.value.trim()||(t.dataset.ss==="name"?"My Tracker":t.value);commit()}
  else if(t.dataset.hide){const H=state.settings.hide,k=t.dataset.hide;state.settings.hide=t.checked?H.filter(x=>x!==k):[...H,k];commit()}
  else if(t.dataset.wd){state.wk[t.dataset.wd]=t.value;commit()}
  else if(t.dataset.pn){state.plan[t.dataset.pn].name=t.value.trim()||"Session";commit()}
  else if(t.dataset.pe){state.plan[t.dataset.pe].ex=t.value.split("\n").map(x=>x.trim()).filter(Boolean).map(x=>{const[a,b]=x.split("|").map(y=>y.trim());return[a,b||""]});commit()}
  else if(t.id==="steps"){setHab("st",parseInt(t.value,10)||0)}
  else if(t.id==="lift"){ui.lift=t.value;render()}
  else if(t.id==="impf"&&t.files[0]){t.files[0].text().then(txt=>{try{const s=JSON.parse(txt);if(!s.foods||!s.logs)throw 0;state=s;defaults();ui.msg="Restored ✓ "+Object.keys(s.logs).length+" days of food, "+(s.body||[]).length+" body entries";commit()}catch(err){const m=document.getElementById("impmsg");if(m)m.textContent="That file isn't a backup from this app."}})}
  else if(t.id==="sess"){ui.sess[ui.date]=t.value;const W=curW();if(W){W.s=t.value;commit()}else render()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeSheet();closeWrap()}if(e.key==="Enter"&&e.target.id&&/^r\d+$/.test(e.target.id)){e.preventDefault();const b=document.querySelector(`[data-a="set"][data-i="${e.target.id.slice(1)}"]`);if(b)b.click()}});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target,v=n=>f.elements[n]?String(f.elements[n].value).trim():"";
  if(f.id==="cf"){const x={n:v("n"),u:v("u")||"1 serving",k:+v("k")||0,p:+v("p")||0,c:+v("c")||0,f:+v("f")||0};if(f.elements.save.checked)state.foods.push({id:uid(),...x});addEntry(x,ui.qty)}
  else if(f.id==="ff"){const x={n:v("n"),u:v("u")||"1 serving",k:+v("k")||0,p:+v("p")||0,c:+v("c")||0,f:+v("f")||0},id=v("id");const o=id&&state.foods.find(q=>q.id===id);if(o)Object.assign(o,x);else state.foods.push({id:uid(),...x});commit()}
  else if(f.id==="if"){const x={n:v("n"),cat:v("cat")||"Other",k:+v("k")||0,p:+v("p")||0,c:+v("c")||0,f:+v("f")||0},id=v("id");if(+v("tb"))x.tb=+v("tb");const o=id&&ingOf(id);if(o)Object.assign(o,x);else state.ing.push({id:uid(),...x});f.reset();commit();toast(`Saved ${esc(x.n)}`,"good")}
  else if(f.id==="bf"){const n=k=>v(k)===""?undefined:+v(k);const x={};for(const k of["w","smm","bfm","pbf",...MEAS.map(m=>m[0])]){const q=n(k);if(q!==undefined&&!isNaN(q))x[k]=q}if(!Object.keys(x).length)return;const o=state.body.find(q=>q.d===v("d"));if(o)Object.assign(o,x);else state.body.push({d:v("d"),...x});commit()}
});
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.d){ui.op[d.dataset.d]=d.open;saveUI()}},true);
window.addEventListener("scroll",()=>{if(document.querySelector(".tipg")){clearTimeout(tipT);tipT=setTimeout(clearTips,400)}},{passive:true});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(TABS[h]&&h!==ui.tab){ui.tab=h;ui.msg="";ui.enter=1;render();window.scrollTo(0,0)}});
try{if(!state.achInit)checkAch()}catch(e){}
ui.enter=1;if(ui.restEnd>Date.now())restI=setInterval(tickRest,250);else ui.restEnd=0;
render();
}
</script></body></html>
